name: Kurumsal CI & Guvenlik Denetimi

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Tip Kontrolu, Testler ve Guvenlik
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodu Indir
        uses: actions/checkout@v4

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bagimliliklari Yukle
        run: npm ci

      - name: TypeScript Tip Kontrolu
        run: npm run typecheck

      - name: Birim ve Guvenlik Testlerini Calistir
        run: npm test

      - name: Yuksek Riskli Bagimlilik Denetimi
        run: npm audit --omit=dev --audit-level=high

