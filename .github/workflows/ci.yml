name: Kurumsal Güvenlik, Tip ve Kalite Denetimi (CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Tip Kontrolü, Lint, Testler ve Sıfır-Zafiyet Denetimi
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: TypeScript Tip Denetimi (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint Statik Kod Analizi
        run: npm run lint

      - name: Güvenlik, KVKK ve İş Mantığı Birim Testleri
        run: npm test

      - name: Bağımlılık Güvenlik Denetimi (Sıfır Zafiyet Politikası)
        run: npm audit --audit-level=low
